<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>HTML総合課題</title>
</head>
<body>

  <h1>HTML総合課題</h1>

  <ul>
    <li>メニュー1</li>
    <li>メニュー2</li>
  </ul>

  <h2>個人情報入力</h2>

  <form>
    <p>お名前</p>
    <input type="text" placeholder="姓">
    <input type="text" placeholder="名">

    <p>自己紹介</p>
    <textarea></textarea>

    <p>血液型</p>
    <select>
      <option>A型</option>
      <option>B型</option>
      <option>O型</option>
      <option>AB型</option>
    </select>

    <p>性別</p>
    <input type="radio" name="gender"> 男
    <input type="radio" name="gender"> 女

    <br><br>
    <button type="reset">キャンセル</button>
    <button type="submit">送信</button>
  </form>

</body>
</html>
