<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HTML総合課題</title>
</head>
<body>
    <header>
        <h1>HTML総合課題</h1>
        <nav>
            <ul>
                <li>メニュー1</li>
                <li>メニュー2</li>
            </ul>
        </nav>
    </header>

    <h2>個人情報入力</h2>

    <form action="#">
        <table>
            <tr>
                <td><label for="name">お名前</label></td>
            </tr>
            <tr>
                <td>
                    <input type="text" id="name" placeholder="姓">
                    <br>
                    <input type="text" placeholder="名">
                </td>
            </tr>
            <tr>
                <td><label for="intro">自己紹介</label></td>
            </tr>
            <tr>
                <td>
                    <textarea id="intro"></textarea>
                </td>
            </tr>
        </table>

        <p>
            <strong>aaa aaa aaa</strong><br>
            aaa aaa aaa<br>
            aaa aaa aaa
        </p>

        <p>血液型</p>
        <select name="blood_type">
            <option value="">血液型</option>
            <option value="A">A型</option>
            <option value="B">B型</option>
            <option value="O">O型</option>
            <option value="AB">AB型</option>
        </select>

        <p>性別</p>
        <label><input type="radio" name="gender" checked> 男</label>
        <label><input type="radio" name="gender"> 女</label>

        <br><br>
        <button type="button">キャンセル</button>
        <button type="submit">送信</button>
    </form>

    <p>© 2019 ALCHEMY inc.</p>
</body>
</html>
